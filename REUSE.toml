# Copyright and licensing for files that cannot carry inline SPDX headers.

version = 1
SPDX-PackageName = "renovate-config"
SPDX-PackageSupplier = "Alex Brandt <alunduil@gmail.com>"
SPDX-PackageDownloadLocation = "https://github.com/alunduil/renovate-config"

# - JSON: no comment syntax.
# - Markdown: inline HTML comment headers render visibly in some viewers.
# - LICENSE: holds the conventional text; REUSE reads the SPDX-canonical
#   copy in LICENSES/MIT.txt.
[[annotations]]
path = ["**.json", "**.md", "LICENSE"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Alex Brandt <alunduil@gmail.com>"
SPDX-License-Identifier = "MIT"
