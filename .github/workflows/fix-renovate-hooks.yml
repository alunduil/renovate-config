---
# Runs a caller's hooks on a Renovate pull request and pushes their fixes as
# the alunduil-hook-fix App, whose push re-runs the required checks.
#
# The hooks and the App key never share a job: the hooks run the pull
# request's dependency code, so that job holds no secrets and no id-token.
#
# alunduil-infrastructure's hook-fix provider admits only this file's
# job_workflow_ref, so renaming or moving it revokes the push job's access.
name: Fix hooks on Renovate branches

on:
  workflow_call:
    inputs:
      node-version-file:
        description: Installs pnpm, Node from this file, and the lockfile's packages before the hooks.
        type: string
        default: ''
      setup:
        description: Shell command run before the hooks, for tools they need.
        type: string
        default: ''
      hook-runner:
        description: pre-commit or prek.
        type: string
        default: pre-commit

env:
  # Carries the hooks job's fixes to the push job, as file and artifact.
  HOOK_FIX_DIFF: hook-fix.diff
  # renovate: datasource=pypi depName=pre-commit
  PRE_COMMIT_VERSION: '4.7.0'
  # renovate: datasource=pypi depName=prek
  PREK_VERSION: '0.5.7'

jobs:
  hooks:
    name: Run hooks on the Renovate branch
    # A fork's pull request never reaches the push job. Skipping the App's own
    # pushes ends hooks that rewrite each other's output as a red check rather
    # than a push loop.
    if: >-
      startsWith(github.head_ref, 'renovate/')
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.sender.login != 'alunduil-hook-fix[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      has-fixes: ${{ steps.fixes.outputs.has-fixes }}

    steps:
      # The head commit, not the merge ref, so the diff applies to the branch.
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install pnpm
        if: inputs.node-version-file != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node
        if: inputs.node-version-file != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: pnpm

      - name: Install packages
        if: inputs.node-version-file != ''
        run: pnpm install --frozen-lockfile

      - name: Run setup
        if: inputs.setup != ''
        run: ${{ inputs.setup }}

      - name: Install hook runner
        env:
          HOOK_RUNNER: ${{ inputs.hook-runner }}
        run: |
          case "${HOOK_RUNNER}" in
            pre-commit) pipx install "pre-commit==${PRE_COMMIT_VERSION}" ;;
            prek) pipx install "prek==${PREK_VERSION}" ;;
            *)
              echo "::error::hook-runner must be pre-commit or prek, not ${HOOK_RUNNER}"
              exit 1
              ;;
          esac

      # A hook that fixes files exits non-zero, so the status is ignored and
      # the diff decides.
      - name: Run hooks
        env:
          HOOK_RUNNER: ${{ inputs.hook-runner }}
        run: |
          "${HOOK_RUNNER}" run --all-files || true

      # Tracked files only: a file a hook newly creates isn't carried.
      - name: Capture fixes
        id: fixes
        run: |
          if ! git diff --binary --exit-code > "${RUNNER_TEMP}/${HOOK_FIX_DIFF}"; then
            echo "has-fixes=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload fixes
        if: steps.fixes.outputs.has-fixes == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.HOOK_FIX_DIFF }}
          path: ${{ runner.temp }}/${{ env.HOOK_FIX_DIFF }}
          if-no-files-found: error
          retention-days: 1

  push:
    name: Push hook fixes to the Renovate branch
    needs: hooks
    if: needs.hooks.outputs.has-fixes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: fix-renovate-hooks-${{ github.repository }}-${{ github.head_ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write

    steps:
      # Identifiers from alunduil-infrastructure's bootstrap outputs
      # hook_fix_workload_identity_provider and hook_fix_reader_email.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/654280143615/locations/global/workloadIdentityPools/hook-fix/providers/github-provider
          service_account: hook-fix-reader@alunduil.iam.gserviceaccount.com

      - name: Read App credentials
        id: secrets
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            app-id:alunduil/hook-fix-app-id
            private-key:alunduil/hook-fix-app-private-key

      - name: Create App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ steps.secrets.outputs.app-id }}
          private-key: ${{ steps.secrets.outputs.private-key }}
          permission-contents: write

      # Nothing from the checkout runs in this job: no hooks, no package
      # installs, only git apply, commit, and push.
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Download fixes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.HOOK_FIX_DIFF }}
          path: ${{ runner.temp }}

      - name: Configure App identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          user_id="$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Apply fixes
        run: git apply --index "${RUNNER_TEMP}/${HOOK_FIX_DIFF}"

      # The diff comes from a job that ran dependency code, so the App pushes
      # only in-place edits to existing files. --summary is empty exactly
      # then; a submodule pointer is the one in-place edit that isn't a file.
      # The App lacks the workflows permission GitHub requires to push
      # .github/workflows changes.
      - name: Check fixes
        run: |
          if [ -n "$(git diff --cached --no-renames --summary)" ] \
            || git diff --cached --raw | grep -q '^:160000'; then
            echo "::error::Hook fixes add, delete, or re-type files; run the hooks by hand."
            git diff --cached --no-renames --summary
            exit 1
          fi
          if [ -n "$(git diff --cached --name-only -- .github/workflows)" ]; then
            echo "::error::Hook fixes touch workflow files, which the App can't push; run the hooks by hand."
            git diff --cached --name-only -- .github/workflows
            exit 1
          fi

      - name: Commit fixes
        run: |
          git commit --message "style: apply hook fixes"

      # A branch that moved since the hooks ran has a newer run of its own,
      # whether Renovate pushed or a duplicate run already pushed fixes. The
      # push stays non-force, so a move between this check and the push is
      # rejected rather than overwritten.
      - name: Push fixes
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          remote_sha="$(git ls-remote origin "refs/heads/${HEAD_REF}" | cut -f1)"
          if [ "${remote_sha}" != "${HEAD_SHA}" ]; then
            echo "::notice::${HEAD_REF} moved since the hooks ran; skipping the push."
            exit 0
          fi
          git push origin "HEAD:refs/heads/${HEAD_REF}"
