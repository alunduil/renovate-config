---
# Install: pre-commit install --hook-type pre-commit --hook-type commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: check-case-conflict
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: check-json
      - id: check-yaml

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.0
    hooks:
      - id: markdownlint-cli2

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ['--strict']

  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse

  # The default `files` pattern matches renovate.json, not default.json.
  # Without --no-global, the validator checks a named file as self-hosted
  # global config, not repo config.
  #
  # Presets in `extends` go unresolved, so a misspelt name passes here and
  # fails only on the next Renovate run.
  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.181.6
    hooks:
      - id: renovate-config-validator
        files: ^default\.json$
        args: [--strict, --no-global]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
