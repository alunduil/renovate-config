---
extends: default

rules:
  # SHA-pinned `uses:` lines run past 80 columns and carry a one-space
  # version comment. Resource names such as a workload identity provider
  # can't be broken at all.
  line-length:
    max: 120
    allow-non-breakable-inline-mappings: true
  comments:
    min-spaces-from-content: 1

  # `on:` is a GitHub Actions trigger key, not a boolean.
  truthy:
    check-keys: false
