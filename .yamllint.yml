extends: default

rules:
  # Workflow YAML carries URLs and SHA pins that shouldn't be wrapped.
  line-length:
    max: 120

  comments:
    min-spaces-from-content: 1

  # `on:` is a GitHub Actions trigger key, not a boolean.
  truthy:
    check-keys: false
