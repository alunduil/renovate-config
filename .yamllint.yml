---
extends: default

rules:
  # SHA-pinned `uses:` lines run past 80 columns and carry a one-space
  # version comment. An unbreakable value, such as a resource name, may run
  # longer.
  line-length:
    max: 120
    allow-non-breakable-inline-mappings: true
  comments:
    min-spaces-from-content: 1

  # `on:` is a GitHub Actions trigger key, not a boolean.
  truthy:
    check-keys: false
